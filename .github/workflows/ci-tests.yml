# reference:
#   - https://github.com/actions/checkout
#   - https://github.com/codecov/codecov-action
#   - https://github.com/prefix-dev/setup-pixi

name: ci-tests

on:
  push:
    branches:
      - "main"
      - "v*x"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: "${{ matrix.session }} (py${{ matrix.python-version }} ${{ matrix.os }})"

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            session: doctest
            pixi-environment: docs-py314
            pixi-task: doctest
          - os: ubuntu-latest
            python-version: "3.14"
            session: gallery
            pixi-environment: test-py314
            pixi-task: gallery
          - os: ubuntu-latest
            python-version: "3.14"
            session: tests
            pixi-environment: test-py314
            pixi-task: tests-coverage
            coverage: true
          - os: ubuntu-latest
            python-version: "3.13"
            session: tests
            pixi-environment: test-py313
            pixi-task: tests
          - os: ubuntu-latest
            python-version: "3.12"
            session: tests
            pixi-environment: test-py312
            pixi-task: tests

    env:
      # NOTE: IRIS_TEST_DATA_VERSION is also set in benchmarks_run.yml
      IRIS_TEST_DATA_VERSION: "2.32"

    steps:
      - name: "checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "environment configure"
        env:
          # Maximum cache period (in weeks) before forcing a cache refresh.
          CACHE_WEEKS: 2
        run: |
          echo "CACHE_PERIOD=$(date +%Y).$(expr $(date +%U) / ${CACHE_WEEKS})" >> ${GITHUB_ENV}

      - name: "data cache"
        uses: $/.github/workflows/composite/iris-data-cache
        with:
          cache_build: 6
          env_name: ${{ matrix.pixi-environment }}
          version: ${{ env.IRIS_TEST_DATA_VERSION }}

      - name: "setup Pixi"
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: v0.83.0
          environments: ${{ matrix.pixi-environment }}
          frozen: true
          activate-environment: true
          cache-key: iris-${{ matrix.pixi-environment }}-

      - name: "cartopy cache"
        uses: $/.github/workflows/composite/cartopy-cache
        with:
          cache_build: 6
          cache_period: ${{ env.CACHE_PERIOD }}
          pixi_environment: ${{ matrix.pixi-environment }}

      # TODO: drop use of site.cfg and explicit use of mplrc
      - name: "iris configure"
        env:
          SITE_CFG: lib/iris/etc/site.cfg
          MPL_RC: ${HOME}/.config/matplotlib/matplotlibrc
        run: |
          mkdir -p $(dirname ${SITE_CFG})
          echo ${SITE_CFG}
          echo "[Resources]" >> ${SITE_CFG}
          echo "test_data_dir = ${HOME}/iris-test-data/test_data" >> ${SITE_CFG}
          echo "doc_dir = ${GITHUB_WORKSPACE}/docs" >> ${SITE_CFG}
          cat ${SITE_CFG}
          mkdir -p $(dirname ${MPL_RC})
          echo ${MPL_RC}
          echo "backend : agg" >> ${MPL_RC}
          echo "image.cmap : viridis" >> ${MPL_RC}
          cat ${MPL_RC}

      - name: "iris ${{ matrix.session }}"
        env:
          # Force coloured output on GitHub Actions.
          PY_COLORS: "1"
        run: |
          pixi run --frozen --environment ${{ matrix.pixi-environment }} ${{ matrix.pixi-task }}

      - name: "upload coverage report"
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
