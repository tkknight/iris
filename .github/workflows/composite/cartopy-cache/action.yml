name: "cartopy-cache"
description: "create and cache cartopy assets"

#
inputs:
  cache_build:
    description: "conda environment cache build number"
    required: false
    default: "0"
  cache_period:
    description: "conda environment cache timestamp"
    required: true
  pixi_environment:
    description: "Pixi environment containing Cartopy"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cartopy-cache
      with:
        path: ~/.local/share/cartopy
        key: ${{ runner.os }}-cartopy-${{ inputs.pixi_environment }}-p${{ inputs.cache_period }}-b${{ inputs.cache_build }}

    - if: steps.cartopy-cache.outputs.cache-hit != 'true'
      env:
        CARTOPY_SHARE_DIR: ~/.local/share/cartopy
        CARTOPY_FEATURE: https://raw.githubusercontent.com/SciTools/cartopy/v0.20.0/tools/cartopy_feature_download.py
        PIXI_ENVIRONMENT: ${{ inputs.pixi_environment }}
      shell: bash
      run: |
        wget --quiet ${CARTOPY_FEATURE}
        mkdir -p ${CARTOPY_SHARE_DIR}
        pixi run --frozen --environment ${PIXI_ENVIRONMENT} python cartopy_feature_download.py physical --output ${CARTOPY_SHARE_DIR} --no-warn
