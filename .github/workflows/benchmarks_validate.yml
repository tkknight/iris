# Reference
#    - https://github.com/actions/checkout
#    - https://github.com/actions/cache

name: benchmarks-validate
run-name: Validate the benchmarking setup

on:
  push:
    branches:
      - "main"
      - "v*x"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      # Lets us manually bump the cache to rebuild
      ENV_CACHE_BUILD: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: v0.83.0
          environments: benchmark-py314
          frozen: true
          activate-environment: true
          cache-key: iris-benchmark-py314-${{ hashFiles('pixi.lock') }}

      - name: Restore environment cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            benchmarks/.asv/env
            $CONDA/pkgs
          key: ${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ env.ENV_CACHE_BUILD }}

      - name: Validate setup
        run: pixi run --frozen --environment benchmark-py314 benchmarks -- validate

      - name: Save environment cache
        # Security: PRs are potentially malformed/malicious, so only allow runs on trunk
        #  branches to update the cache, to avoid cache poisoning.
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            benchmarks/.asv/env
            $CONDA/pkgs
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
